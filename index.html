<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SheSphere — Your Safe Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #e8407a;
      --purple:  #7c3aed;
      --soft:    #fdf2f8;
      --white:   #ffffff;
      --dark:    #1a0a2e;
      --muted:   #6b7280;
      --border:  #f0d6e8;
      --error:   #ef4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--soft);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(232,64,122,0.18) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 8px 48px rgba(124,58,237,0.10), 0 2px 8px rgba(232,64,122,0.06);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      position: relative;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 10px;
    }
    .logo-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--dark);
      display: block;
    }
    .logo-tagline { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .tabs {
      display: flex;
      background: var(--soft);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--white);
      color: var(--pink);
      box-shadow: 0 1px 6px rgba(232,64,122,0.15);
    }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }

    label { font-size: 13px; font-weight: 500; color: var(--dark); }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(232,64,122,0.10);
    }
    input::placeholder { color: #c4b5c8; }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 42px; }
    .eye-btn {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 18px;
      color: var(--muted);
      line-height: 1;
    }

    .forgot { text-align: right; margin-top: -8px; }
    .forgot a { font-size: 12px; color: var(--pink); text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); opacity: 1; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover { background: var(--soft); border-color: var(--pink); }

    .terms { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
    .terms a { color: var(--pink); text-decoration: none; }

    .error-msg { font-size: 12px; color: var(--error); display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🌸</div>
      <span class="logo-name">SheSphere</span>
      <p class="logo-tagline">Your safe space, everywhere you go</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
          <button type="button" class="eye-btn" onclick="togglePassword('loginPassword', this)">👁</button>
        </div>
        <span class="error-msg" id="loginError">Incorrect email or password.</span>
      </div>
      <div class="forgot"><a href="#">Forgot password?</a></div>
      <button type="submit" class="btn">Login to SheSphere</button>
      <div class="divider">or</div>
      <button type="button" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.8 0 6.9 5.4 3 13.3l7.8 6C12.8 13 17.9 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/>
          <path fill="#FBBC05" d="M10.8 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l8.3-6z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.2-4.1-13-9.7l-8.3 6C6.8 42.5 14.8 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </form>

    <!-- SIGNUP FORM -->
    <form class="form" id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" placeholder="Ayushi Sharma" required />
      </div>
      <div class="form-group">
        <label for="signupEmail">Email address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="signupCollege">College name</label>
        <input type="text" id="signupCollege" placeholder="GLA University, Mathura" />
      </div>
      <div class="form-group">
        <label for="signupCity">City</label>
        <input type="text" id="signupCity" placeholder="Mathura" />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="signupPassword" placeholder="Min. 8 characters" required />
          <button type="button" class="eye-btn" onclick="togglePassword('signupPassword', this)">👁</button>
        </div>
        <span class="error-msg" id="signupError">Password must be at least 8 characters.</span>
      </div>
      <button type="submit" class="btn">Create my account</button>
      <p class="terms">
        By signing up you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </p>
    </form>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass  = document.getElementById('loginPassword').value;
      const err   = document.getElementById('loginError');
      if (email === 'test@shesphere.com' && pass === 'password123') {
        alert('✅ Login successful! (Backend coming in Week 3)');
        err.classList.remove('show');
      } else {
        err.classList.add('show');
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const pass = document.getElementById('signupPassword').value;
      const err  = document.getElementById('signupError');
      if (pass.length < 8) {
        err.classList.add('show');
        return;
      }
      err.classList.remove('show');
      alert('✅ Account created! (Backend coming in Week 3)');
    }
  </script>

</body>
</html>
